# The dev container: ROS 2 Foxy on Ubuntu 20.04, as on the robot. scripts/dev.sh up
# (or docker compose --profile foxy up -d --build). Build artefacts live in named volumes, so the
# macOS bind mount only carries the sources.
name: hotdog

x-dev: &dev
  init: true
  stdin_open: true
  tty: true
  shm_size: 1gb
  environment:
    VNC: ${VNC:-1}
    VNC_PASSWORD: ${VNC_PASSWORD:-dharma}
    VNC_RESOLUTION: ${VNC_RESOLUTION:-1600x900}
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

x-build: &build
  context: .
  dockerfile: docker/Dockerfile

services:
  dev-foxy:
    <<: *dev
    profiles: [foxy]
    build:
      <<: *build
      args:
        ROS_DISTRO: foxy
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: hotdog-dev:foxy
    container_name: hotdog-dev-foxy
    hostname: hotdog-foxy
    ports:
      - "127.0.0.1:5903:5901" # VNC (vnc://localhost:5903)
      - "127.0.0.1:6082:6080" # noVNC (http://localhost:6082/vnc.html)
    volumes:
      - .:/home/robot/ws
      - build-foxy:/home/robot/ws/build
      - install-foxy:/home/robot/ws/install
      - log-foxy:/home/robot/ws/log

volumes:
  build-foxy:
  install-foxy:
  log-foxy:
