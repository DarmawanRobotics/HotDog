# scripts/start_tmux.sh robot: the stack on the robot, one window per subsystem (for debugging:
# the service runs the same with `ros2 launch hotdog robot.launch.py`; stop it first).
# For this robot's settings add params_file:=/etc/hotdog/site.yaml to BRINGUP_ARGS.
session_name: robot
environment:
  ROBOT_NS: m20
  ROBOT_DRIVER: m20_bringup
  ROBOT_IP: 10.21.31.103
  SITE: ""
  SITES_DIR: ""
  POD_IP: 10.21.31.26 # unipod_driver default
setup: >-
  source /opt/ros/${ROS_DISTRO}/setup.bash && source ${WS}/install/setup.bash &&
  BRINGUP_CONFIG=$(ros2 pkg prefix hotdog)/share/hotdog/config &&
  BRINGUP_ARGS="robot_params:=$BRINGUP_CONFIG/robot.yaml params_file:=$BRINGUP_CONFIG/stack.yaml"
windows:
  - window_name: driver
    panes:
      - when: ROBOT_DRIVER
        shell_command: >-
          ros2 launch ${ROBOT_DRIVER} bringup.launch.py namespace:=${ROBOT_NS}
          robot_ip:=${ROBOT_IP} driver_params:=$BRINGUP_CONFIG/m20_driver.yaml
        otherwise: "ROBOT_DRIVER unset: start the robot driver here (namespace ${ROBOT_NS})"
  - window_name: lidar
    panes:
      - shell_command: ros2 launch hotdog_base base.launch.py $BRINGUP_ARGS
  - window_name: odometry
    panes:
      - shell_command: ros2 launch dharma_odometry odometry.launch.py $BRINGUP_ARGS method:=external
  - window_name: localization
    panes:
      - shell_command: ros2 launch dharma_localization localization.launch.py $BRINGUP_ARGS
  - window_name: perception
    panes:
      - shell_command: ros2 launch dharma_perception perception.launch.py $BRINGUP_ARGS
  - window_name: routes
    panes:
      - shell_command: ros2 launch dharma_mapping mapping.launch.py $BRINGUP_ARGS site:=${SITE}
  - window_name: navigation
    layout: even-vertical
    panes:
      - shell_command: >-
          ros2 launch dharma_navigation navigation.launch.py $BRINGUP_ARGS
          battery_topic:=/${ROBOT_NS}/battery odom_topic:=/${ROBOT_NS}/odom
      # the control mux is the only publisher of the driver's cmd_vel
      - shell_command: >-
          ros2 launch dharma_control control.launch.py $BRINGUP_ARGS
          cmd_vel_topic:=/${ROBOT_NS}/cmd_vel
  - window_name: health
    panes:
      - shell_command: ros2 launch dharma_health health.launch.py $BRINGUP_ARGS
  - window_name: inspection
    layout: even-vertical
    panes:
      - shell_command: >-
          ros2 launch unipod_driver unipod_driver.launch.py namespace:=unipod
          ip:=${POD_IP}
      - shell_command: >-
          ros2 launch hotdog_inspection inspection.launch.py $BRINGUP_ARGS
          sites_dir:=${SITES_DIR}
  - window_name: patrol
    layout: even-vertical
    panes:
      - shell_command: >-
          ros2 launch hotdog_patrol patrol.launch.py $BRINGUP_ARGS robot_ns:=${ROBOT_NS}
          sites_dir:=${SITES_DIR}
      - shell_command: ros2 launch hotdog_reports reports.launch.py $BRINGUP_ARGS
      - shell_command: ros2 launch hotdog_alerts alerts.launch.py $BRINGUP_ARGS
  - window_name: shell
    layout: even-horizontal
    panes:
      - shell_command: "# scripts/hotdog.sh status | patrol | return | estop | teach ..."
      - shell_command: watch -n 5 scripts/hotdog.sh status
