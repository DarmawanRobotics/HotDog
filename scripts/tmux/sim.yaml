# scripts/start_tmux.sh sim: HotDog on dharma_sim (the whole bringup) and shells to drive it.
session_name: sim
environment:
  SITE: mall_loop
  SITES_DIR: /tmp/dharma_sim/sites
  SCENARIO: ""
setup: source /opt/ros/${ROS_DISTRO}/setup.bash && source ${WS}/install/setup.bash
windows:
  - window_name: sim
    panes:
      - shell_command: >-
          ros2 launch hotdog sim.launch.py site:=${SITE} sites_dir:=${SITES_DIR}
          scenario:=${SCENARIO}
  - window_name: shell
    layout: even-horizontal
    panes:
      - shell_command: >-
          # ros2 topic pub --once /sim/obstacles geometry_msgs/msg/PoseArray
          "{poses: [{position: {x: 2.0, y: -3.0}}]}"
      - shell_command: watch -n 5 scripts/hotdog.sh status
