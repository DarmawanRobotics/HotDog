# The robot profile of HotDog: a Deep Robotics Lynx M20 (wheel-legged) with the UniPod MT11
# and the Hertzinno HZ-FA-371 on its payload rails. Every Dharma node reads it (robot.*);
# the bringup validates it at start. Measure footprint and base_height on the robot with its
# payload mounted; the limits stay below what m20_driver clamps (max_vx 1.0, max_vy 0.5,
# max_wz 1.0) so the control mux, not the driver, is what slows the robot down.
/**:
  ros__parameters:
    robot:
      name: lynx_m20
      kinematics: omni # the M20 walks and rolls in x, y and yaw
      base_height: 0.42 # m, base_link (body centre) above the ground when standing
      footprint: # m, base_link to the edges: 820 x 430 mm body, legs and wheels outside it
        front: 0.43
        rear: 0.43
        half_width: 0.25
      limits:
        max_vx: 0.8 # m/s, patrol on gravel and cable trenches
        max_vy: 0.3 # m/s
        max_wz: 0.8 # rad/s
        max_accel: 0.6 # m/s^2
        max_decel: 0.8 # m/s^2, braking: measure it (Dharma hub, Robot Profile)
        max_yaw_accel: 1.5 # rad/s^2
        reaction_time: 0.35 # s, cmd_vel -> UDP axis command at 20 Hz -> RL controller
      frames:
        map: map
        odom: odom
        base: base_link
