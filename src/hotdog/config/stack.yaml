# Per-node overrides of the Dharma package defaults for this robot (only what differs).
# Merged with params_file:= (later wins) and passed to every package launch. Each package's
# README lists its parameters; `ros2 param describe /<node> <name>` shows units and ranges.
# A section that matches no started node is reported at launch (typo).
# Backing up after a stop point (path_follower_node inspection.reverse_distance_m > 0) needs
# the avoidance to see behind: lidar_sector_node front.fov_deg: 360.0.

control_mux_node:
  ros__parameters:
    use_health_limit: true # scale commands by health/status speed_scale
    remote_sources: [handheld, dashboard] # control/remote/<source>/cmd_vel

health_monitor_node:
  ros__parameters:
    sensors:
      topics: ["/livox/lidar:5.0", "/Odometry:8.0"] # "topic:min_hz[:max_age_sec]"
    nodes:
      # The bringup adds every node it starts; list the robot driver's nodes here.
      expected: [""]
    degradation:
      rules: ["sensor:/livox/lidar=0.5", "sensor:/Odometry=0.5", "tf:*=0.5"]
    # the offset of this computer's clock to its time source (scripts/setup.sh install timesync)
    clock.enabled: true

docking_node:
  ros__parameters:
    # Docking onto the charger (docking/dock, docking/undock): the dock tag on TF from the
    # fiducial detector, the docked pose in front of it and the driver's Trigger services.
    tag.frame: charging_dock # apriltag tag 4 (dharma_perception), or the ArUco detector's frame
    goal.distance: 0.75 # m, base_link to the tag when docked (measure it on the dock)
    hooks.sit: [""] # e.g. /robot/sit
    hooks.charge: [""] # e.g. /robot/charge/start
    hooks.stop_charge: [""] # e.g. /robot/charge/stop
    hooks.stand: [""] # e.g. /robot/stand
