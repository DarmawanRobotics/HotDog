# rslidar_sdk configuration (not ROS parameters: the node reads this file, config_path) for the
# two RoboSense Airy of the Lynx M20. Each Airy sends its packets to one destination address
# and port pair, set in the LiDAR's web page: this computer's address and the ports below.
# Check with `sudo tcpdump -ni any udp port 6699 or udp port 6698` before launching.
common:
  msg_source: 1 # packets from the LiDARs on the network
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699 # front Airy
      difop_port: 7788
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.1
      max_distance: 60
      use_lidar_clock: false # stamps on this computer's clock (true needs PTP to the LiDAR)
      dense_points: true # no NaN points
      ts_first_point: true
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: front_lidar_link # m20_description
      ros_recv_packet_topic: /lidar/front/packets
      ros_send_packet_topic: /lidar/front/packets
      ros_send_imu_data_topic: /lidar/front/imu
      ros_send_point_cloud_topic: /lidar/front/points
      ros_queue_length: 10
  - driver:
      lidar_type: RSAIRY
      msop_port: 6698 # rear Airy
      difop_port: 7789
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.1
      max_distance: 60
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: rear_lidar_link
      ros_recv_packet_topic: /lidar/rear/packets
      ros_send_packet_topic: /lidar/rear/packets
      ros_send_imu_data_topic: /lidar/rear/imu
      ros_send_point_cloud_topic: /lidar/rear/points
      ros_queue_length: 10
