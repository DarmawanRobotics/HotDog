# hotdog_inspection defaults: only what differs from the configuration dataclasses, plus notes.
# Every parameter with its unit and range: `ros2 param describe /inspection_node <name>`.
# The map and base frames come from the robot profile (robot_params:=robot.yaml).
inspection_node:
  ros__parameters:
    enabled: true # live: false lets the stop points pass without inspection
    sites_dir: ~/.hotdog/sites # <site>/inspection.yaml: points (map frame) and their targets
    reports_dir: ~/.hotdog/reports # <day>/<time>_<point>/report.json + images, <day>/findings.csv
    match_radius_m: 1.5 # a stop this close to a point inspects it (taught at the same spot)
    max_duration_sec: 150.0 # per point: keep below the follower's hooks.inspection_timeout_sec
    pod:
      namespace: /unipod # unipod_driver
      settle_sec: 2.5 # gimbal and zoom (auto focus) before measuring
    thermal:
      ambient_c: 30.0 # live: the air temperature at the site (ros2 param set ... thermal.ambient_c 33.0)
      width: 640 # MT11 thermal pixels (1280 x 1024 with AI super-resolution on)
      height: 512
      samples: 3 # per region, the median is used
      refresh_shutter: true # flat-field correction once per point
      # NETA MTS practice; a target's max_temp_c replaces absolute.critical
      absolute: {attention: 80.0, warning: 90.0, critical: 105.0} # degC
      ambient: {attention: 11.0, warning: 21.0, critical: 41.0} # degC over ambient_c
      similar: {attention: 2.0, warning: 4.0, critical: 16.0} # degC over the other phases
    acoustic:
      # Hertzinno HZ-FA-371 over its HTTP API (the ROS driver is ROS 1 only). The password
      # comes from $HERTZINO_PASSWORD (/etc/hotdog/hotdog.env), never from a parameter.
      enabled: true # live
      host: 192.168.2.204 # factory address; this computer needs an address in 192.168.2.x
      port: 80
      user: admin
      duration_sec: 5.0 # detection time when a target sets none
      # severity of each discharge type (normal | attention | warning | critical)
      corona: attention # common on outdoor HV conductors, watch the trend
      surface: warning # tracking on insulators and terminations
      floating: critical # a floating (loose) part: arcing
      intensity_warning: 0.0 # a discharge this intense is at least a warning; 0: off
      intensity_critical: 0.0 # and critical; set both once the site's levels are known
