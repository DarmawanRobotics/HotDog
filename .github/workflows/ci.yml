name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: |
          pre-commit run --all-files --show-diff-on-failure > lint.log 2>&1 || {
            cat lint.log
            msg=$(tail -c 20000 lint.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Lint failed::$msg"
            exit 1
          }
          cat lint.log

  scripts:
    runs-on: ubuntu-22.04 # setup-python has no Python 3.8 for 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8" # the oldest Python of the stack (Foxy)
      - run: pip install pytest pyyaml
      - name: Shell syntax
        run: for f in scripts/*.sh docker/entrypoint.sh; do bash -n "$f"; done
      - name: Scripts tests
        run: if [ -d scripts/test ]; then python -m pytest -q scripts/test; fi
      - name: Compose file
        run: docker compose --profile foxy config -q

  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the age check compares the commits of the PDFs and their sources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the PDF guides
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            fonts-dejavu-core
          pip install weasyprint==70.0 markdown==3.11.1 pyyaml pillow
          python docs/pdf/build.py
      - name: Committed PDFs are up to date
        run: |
          stale() {
            local pdf=$1 built changed
            shift
            built=$(git log -1 --format=%ct -- "$pdf")
            changed=$(git log -1 --format=%ct -- "$@")
            if [[ -z "$built" || "$changed" -gt "$built" ]]; then
              echo "::warning file=$pdf::older than its sources: python3 docs/pdf/build.py, commit it"
            fi
          }
          stale docs/HotDog-User-Manual.pdf docs/manual docs/pdf
          stale docs/HotDog-Technician-Guide.pdf docs/technician docs/pdf 'src/*/config/*.yaml'
          stale docs/HotDog-Site-Acceptance-Test.pdf docs/acceptance docs/pdf
      - uses: actions/upload-artifact@v4
        with:
          name: guides
          path: docs/*.pdf

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [foxy] # the robot runs Ubuntu 20.04 and Foxy
    container: ros:${{ matrix.distro }}-ros-base
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      ROS_LOCALHOST_ONLY: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Annotation helper
        run: |
          cat > /usr/local/bin/report <<'SH'
          #!/usr/bin/env bash
          # report <title> <log>: the end of a log as one error annotation
          msg=$(tail -c 20000 "$2" | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
          echo "::error title=$1::$msg"
          SH
          chmod +x /usr/local/bin/report
      - name: Refresh the ROS apt key (frozen end-of-life image)
        if: matrix.distro == 'foxy'
        run: |
          # ros:foxy-ros-base was frozen in 2023 with the ROS apt key that expired in 2025.
          python3 -c "import urllib.request as u; u.urlretrieve('https://raw.githubusercontent.com/ros/rosdistro/master/ros.key', '/tmp/ros.key')"
          keyrings=$(grep -rh packages.ros.org /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | grep -oP 'signed-by=\K[^ \]]+' | sort -u || true)
          for keyring in ${keyrings:-/usr/share/keyrings/ros-archive-keyring.gpg}; do
            gpg --batch --yes --dearmor -o "$keyring" /tmp/ros.key
            echo "refreshed $keyring"
          done
          if [ -z "$keyrings" ]; then apt-key add /tmp/ros.key; fi
      - uses: actions/checkout@v4
      - name: The stack from dharma.repos (same branch when it exists), the robot from external.repos
        env:
          DHARMA_TOKEN: ${{ secrets.DHARMA_TOKEN }}
        run: |
          apt-get update && apt-get install -y python3-vcstool git
          vcs import --recursive src < external.repos
          auth="https://x-access-token:${DHARMA_TOKEN}@github.com/"
          git config --global url."$auth".insteadOf "https://github.com/"
          git config --global --add url."$auth".insteadOf "git@github.com:"
          vcs import --recursive src < dharma.repos
          for dep in src/dharma/*/; do
            if git -C "$dep" ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
              git -C "$dep" fetch -q origin "$BRANCH" && git -C "$dep" checkout -q FETCH_HEAD
              echo "$dep -> $BRANCH"
            fi
          done
      - name: ROS dependencies
        run: |
          apt-get update
          rosdep update --rosdistro "$ROS_DISTRO" --include-eol-distros
          # python3-loguru has no focal package: installed below. HotDog runs on the M20's own
          # odometry: dharma_odometry's FAST-LIO / legKILO (and their Livox driver) are not used.
          rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO" \
            --skip-keys "python3-loguru fast_lio legkilo livox_ros_driver2" > rosdep.log 2>&1 || {
            cat rosdep.log
            report "rosdep failed ($ROS_DISTRO)" rosdep.log
            exit 1
          }
          cat rosdep.log
          # focal (Foxy) has no python3-loguru: install it with pip there
          if ! apt-get install -y python3-loguru; then
            apt-get install -y python3-pip && pip3 install loguru
          fi
      - name: Build
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build --event-handlers console_cohesion+ > build.log 2>&1 || {
            cat build.log
            report "Build failed ($ROS_DISTRO)" build.log
            exit 1
          }
          cat build.log
      - name: Test
        run: |
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          source install/setup.bash
          packages=$(colcon list --base-paths src/hotdog* --names-only | xargs)
          status=0
          colcon test --packages-select $packages --executor sequential \
            --event-handlers console_cohesion+ > test.log 2>&1 || status=1
          colcon test-result --verbose >> test.log 2>&1 || status=1
          cat test.log
          if [ "$status" -ne 0 ]; then
            report "Tests failed ($ROS_DISTRO)" test.log
            exit 1
          fi
